<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark CRT Container -->
  <rect width="64" height="64" rx="12" fill="#0a120b" stroke="#00ff66" stroke-width="2.5"/>
  
  <!-- Window Header Bar -->
  <rect x="6" y="6" width="52" height="13" rx="4" fill="#040905"/>
  
  <!-- Traffic Light Window Buttons -->
  <circle cx="14" cy="12.5" r="2.5" fill="#ff5f56"/>
  <circle cx="22" cy="12.5" r="2.5" fill="#ffbd2e"/>
  <circle cx="30" cy="12.5" r="2.5" fill="#27c93f"/>
  
  <!-- CLI Terminal Prompt Chevron > -->
  <path d="M14 30L26 39L14 48" stroke="#00ff66" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Blinking Cursor Line _ -->
  <line x1="32" y1="48" x2="48" y2="48" stroke="#00ffcc" stroke-width="4.5" stroke-linecap="round"/>
</svg>
