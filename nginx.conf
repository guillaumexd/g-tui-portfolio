server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve custom Astro TUI 404 page on 404 error status
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Ensure /404.html is served for unmapped routes
    location = /404.html {
        internal;
    }
}
