services:
  # -------------------------------------------------------------
  # DEV CONTAINER
  # URL: http://localhost:4321
  # -------------------------------------------------------------
  tui-portfolio-dev:
    image: node:22-alpine
    container_name: tui-portfolio-dev
    working_dir: /app
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4321"

  # -------------------------------------------------------------
  # 📦 PRODUCTION CONTAINER
  # URL: http://localhost:8080
  # -------------------------------------------------------------
  tui-portfolio-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tui-portfolio-prod
    ports:
      - "8080:80"
    restart: unless-stopped
